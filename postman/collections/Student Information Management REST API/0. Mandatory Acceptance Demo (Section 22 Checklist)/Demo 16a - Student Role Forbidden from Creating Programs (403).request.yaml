$kind: http-request
url: "{{baseUrl}}/programs"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{studentToken}}
body:
  type: json
  content: |-
    {
      "code": "ILLEGAL",
      "name": "Student Attempt Program"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Returns 403 Forbidden for unauthorized role', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 17000
