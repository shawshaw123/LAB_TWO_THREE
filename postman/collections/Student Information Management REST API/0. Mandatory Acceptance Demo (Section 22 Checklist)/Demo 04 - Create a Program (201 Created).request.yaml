$kind: http-request
url: "{{baseUrl}}/programs"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: json
  content: |-
    {
      "code": "BSDS",
      "name": "Bachelor of Science in Data Science",
      "description": "Focuses on statistical modeling, machine learning, and data analytics.",
      "status": "ACTIVE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Program created successfully', function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 422]);
      });
    language: text/javascript
order: 5000
